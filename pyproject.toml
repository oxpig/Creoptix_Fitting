[build-system]
requires = ["uv_build>=0.8.7,<0.10.0"]
build-backend = "uv_build"

[project]
name = "creoptix-tools"
version = "0.1.8"
description = "Tools for fitting to the sensograms created by Creoptix runs."
readme = "README.md"
license-files = ["LICENCE"]
authors = [
  { name = "Chris Taylor", email = "christopher.taylor@stats.ox.ac.uk" },
]
dependencies = [
    "numpy",
    "openpyxl>=3.1.5",
    "pandas",
    "matplotlib",
    "scipy",
    "ruff>=0.14.1",
    "h5py",
    "datetime>=6.0",
]
